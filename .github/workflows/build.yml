name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - name: Check for warnings in src/
        run: |
          make clean
          make -j"$(nproc)" 2>&1 | tee build.log
          ! grep -E "warning:|error:" build.log | grep -v "vendor/"
      - name: Check the workflow files (YAML + shell syntax)
        run: python3 tools/workflow_lint.py

      - name: Static build (this is what the release artefact is made of)
        run: |
          make STATIC=1 BUILD=build-static -j"$(nproc)"
          ldd build-static/mdt 2>&1 | grep -q "not a dynamic executable" \
            || { echo "error: STATIC=1 did not produce a static binary"; exit 1; }
          build-static/mdt --version
      - name: The static build runs on Alpine (musl, no glibc at all)
        run: |
          # The release artefact is static precisely so it does not care which
          # libc the distribution ships; this is the cheapest way to keep that
          # promise honest (Alpine is musl, Ubuntu is glibc).
          docker run --rm -v "$PWD:/w:ro" -w /w alpine:3.20 \
            /w/build-static/mdt --version
          printf '# alpine\n\n- one\n- two\n\ninline $e^{i\\pi}$\n' > alpine.md
          host_dump=$(build-static/mdt --dump --width=46 alpine.md)
          alpine_dump=$(docker run --rm -v "$PWD:/w:ro" -w /w alpine:3.20 \
            /w/build-static/mdt --dump --width=46 alpine.md)
          [ "$host_dump" = "$alpine_dump" ] \
            || { echo "error: the Alpine rendering differs from the glibc one"; exit 1; }
          echo "the same bytes on musl and glibc"

          # and with no fonts at all (the alpine image ships none) the failure
          # has to say where it looked and what to install
          printf '# no fonts\n' > /tmp/nofont.md
          if docker run --rm -v "$PWD:/w:ro" -v /tmp:/t -w /w alpine:3.20 \
               /w/build-static/mdt --screenshot=/t/o.png /tmp/nofont.md \
               2>/tmp/font-err.txt; then
            echo "error: --screenshot worked without any fonts"; exit 1
          fi
          grep -q "no usable monospace font found" /tmp/font-err.txt
          grep -q "ttf-dejavu" /tmp/font-err.txt
          echo "the no-font error names the packages:"; cat /tmp/font-err.txt
      - name: Tests
        run: sh tests/smoke.sh
      - name: Tests (static build)
        run: BIN=./build-static/mdt sh tests/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mdt-linux-x86_64
          path: build/mdt

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: |
          make BUILD=build-asan \
               OPT="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" -j"$(nproc)"
      - name: Tests under ASan + UBSan
        run: BIN=./build-asan/mdt sh tests/smoke.sh
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
          # the instrumented binary needs looser wall-clock budgets, and its
          # own RSS is several times the real thing (769 MB for a 3 MB document
          # here), so the memory budget is set explicitly instead of scaled
          MDT_TEST_SLOWDOWN: "4"
          MDT_MEM_BUDGET_MB: "2000"

  macos:
    name: macOS (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # the checks run on every platform: this one's python3 has no PyYAML, and
      # that is exactly how the release workflow failed on macOS
      - name: Check the workflow files
        run: python3 tools/workflow_lint.py
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"
      - name: Tests
        run: sh tests/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mdt-macos-arm64
          path: build/mdt

  windows:
    name: Windows (MinGW-w64 cross build + wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the workflow files
        run: python3 tools/workflow_lint.py
      - name: Install MinGW-w64 and wine
        run: |
          sudo apt-get update
          # fonts-dejavu-core: wine ships no fonts of its own, and mdt needs
          # one for --screenshot (tests/windows.sh seeds the wine prefix)
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64 zip file fonts-dejavu-core
      - name: Native build (the wine suite diffs against ./build/mdt)
        run: make -j"$(nproc)"
      - name: Cross compile (x86-64)
        run: make windows -j"$(nproc)"
      - name: Cross compile (32 bit, compile check only)
        run: make windows32 -j"$(nproc)"
      - name: Tests under wine
        run: sh tests/windows.sh
        env:
          WINEDEBUG: "-all"
      - name: Package
        run: sh tools/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mdt-windows
          path: |
            release/mdt-*-win64.zip
            build/win/mdt.exe
