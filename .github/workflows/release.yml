# Builds the binaries for every supported platform and publishes a GitHub
# Release whenever a version tag (v*) is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The build is plain `make` — no cmake, no package manager.  The JS/KaTeX
# assets are pre-generated and committed (src/generated), so CI never needs
# node; `touch` keeps make from re-embedding them on checkout timestamps.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-latest
            target: linux-arm64
            arm64: true
            bin: build/arm64/mdt
            slowdown: "4"
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: win64
            mingw: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the workflow files (YAML + shell syntax)
        run: python3 tools/workflow_lint.py

      - name: Install MinGW-w64 cross compiler
        if: matrix.mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64

      - name: Install the ARM64 cross compiler and qemu
        if: matrix.arm64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user-static binfmt-support
          # binfmt-support registers qemu-aarch64 by itself on the runner image;
          # register it by hand if that did not happen, so ./mdt just runs.
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            sudo sh -c 'echo ":qemu-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:F" > /proc/sys/fs/binfmt_misc/register'
          fi
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Build
        run: |
          touch src/generated/assets_js.cpp
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          if [ "${{ matrix.mingw }}" = "true" ]; then
            make windows -j"$JOBS"
            V="${GITHUB_REF_NAME#v}"
            STAGE="mdt-$V-win64"
            mkdir -p "$STAGE/demo"
            cp build/win/mdt.exe README.md "$STAGE/"
            cp demo/demo.md demo/logo.png "$STAGE/demo/"
            zip -qr "mdt-$V-win64.zip" "$STAGE"
            cp build/win/mdt.exe mdt-win64.exe
          elif [ "${{ matrix.target }}" = "linux-amd64" ]; then
            # STATIC=1: the Linux artefact carries its own libc, so it runs on
            # any distribution instead of only on glibc >= 2.38 (Ubuntu 24.04,
            # Debian 13).  Remote pictures go through the `curl` binary, as
            # they already did in the dynamically linked build.
            make STATIC=1 -j"$JOBS"
            ldd build/mdt 2>&1 | grep -q "not a dynamic executable" \
              || { echo "error: the Linux build is not static"; exit 1; }
            cp build/mdt "mdt-${{ matrix.target }}"
          elif [ "${{ matrix.arm64 }}" = "true" ]; then
            # Same static build as linux-amd64, cross compiled: the release
            # runner is x86-64, the artefact is AArch64 (Raspberry Pi 4/5,
            # Ampere, Apple's Linux VMs and anything else on arm64).
            make STATIC=1 CXX=aarch64-linux-gnu-g++ CC=aarch64-linux-gnu-gcc \
                 BUILD=build/arm64 -j"$JOBS"
            file build/arm64/mdt | grep -q "ARM aarch64" \
              || { echo "error: not an aarch64 binary"; exit 1; }
            file build/arm64/mdt | grep -q "statically linked" \
              || { echo "error: the arm64 build is not static"; exit 1; }
            cp build/arm64/mdt "mdt-${{ matrix.target }}"
          else
            # macOS: -static is not a thing for the Apple linker, and the
            # system libraries are the ones the OS ships, so the ordinary
            # dynamic build is the right artefact here.
            make -j"$JOBS"
            cp build/mdt "mdt-${{ matrix.target }}"
          fi

      - name: Tests
        if: ${{ !matrix.mingw }}
        run: |
          # the arm64 job built into build/arm64 and runs the artefact under
          # qemu (binfmt registration is transparent); the other jobs built
          # build/mdt as usual
          BIN="${{ matrix.bin }}"; BIN="${BIN:-./build/mdt}"
          # qemu emulates AArch64, so the wall-clock budgets in the test tools
          # are loosened exactly the way the sanitizer job loosens them
          MDT_TEST_SLOWDOWN="${{ matrix.slowdown }}"
          MDT_TEST_SLOWDOWN="${MDT_TEST_SLOWDOWN:-1}"
          export BIN MDT_TEST_SLOWDOWN
          sh tests/smoke.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            mdt-${{ matrix.target }}
            mdt-win64.exe
            *.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x dist/mdt-linux-amd64 dist/mdt-linux-arm64 dist/mdt-macos-arm64 2>/dev/null || true

      - name: Install rpm (for the .rpm packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Build the .deb and .rpm packages
        run: python3 packaging/pkgs.py "${GITHUB_REF_NAME}" --from dist --out dist

      - name: Add install.sh, the licence, and SHA256SUMS
        run: |
          cp install.sh LICENSE dist/
          cd dist
          sha256sum mdt-linux-amd64 mdt-linux-arm64 mdt-macos-arm64 \
                    mdt-win64.exe mdt-*.zip mdt-*.rpm mdt_*.deb \
                    install.sh LICENSE > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
